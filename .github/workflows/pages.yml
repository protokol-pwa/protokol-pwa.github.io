# Выкладка зеркала.
#
# Встроенный сборщик GitHub Pages на этом репозитории падал без объяснений
# («Page build failed»), поэтому сайт выкладывается этим рабочим процессом:
# он ничего не собирает, а просто отдаёт содержимое репозитория как есть —
# сборка уже лежит в нём готовой.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Всё, кроме служебных папок: .git весит столько же, сколько сайт.
      - run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Сайт весит 37 МБ в 300 файлах, и GitHub переносит их к себе
          # дольше, чем отведённые по умолчанию десять минут: выкладка
          # срывалась на полпути с «Timeout reached».
          timeout: 1800000
